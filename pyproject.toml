[project]
name = "foss4g2026-attendance-certificate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.9.0",
    "click>=8.4.2",
    "python-dotenv>=1.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[project.scripts]
foss4gcert = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


